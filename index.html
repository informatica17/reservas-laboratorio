<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Reservas de Laboratorios</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS Client v2 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen flex flex-col">

  <!-- Header / Barra Superior -->
  <header class="bg-[#003366] text-white p-4 shadow-md flex justify-between items-center px-6">
    <div class="flex items-center gap-4">
      <div class="bg-white p-1 rounded">
        <span class="text-[#003366] font-bold text-xl px-2">S</span>
      </div>
      <div>
        <p class="text-xs uppercase tracking-wider text-gray-200">Colegio Bicentenario Salesiano Domingo Savio</p>
        <h1 class="text-2xl font-bold">Gestión de Reservas de Laboratorios</h1>
      </div>
    </div>
    <button id="btnAdmin" onclick="toggleAdminModal()" class="bg-slate-700 hover:bg-slate-800 text-amber-300 font-semibold text-sm px-4 py-2 rounded-lg shadow border border-amber-400 flex items-center gap-2">
      🔑 <span id="lblBtnAdmin">Modo Admin</span>
    </button>
  </header>

  <!-- Filtro de Laboratorio / Piso -->
  <div class="flex justify-center gap-3 my-6">
    <button id="tabPrimerPiso" onclick="cambiarPiso('Primer Piso')" class="piso-btn px-6 py-2 rounded-lg font-bold shadow transition bg-gray-200 text-gray-700 hover:bg-gray-300">Primer Piso</button>
    <button id="tabSegundoPiso" onclick="cambiarPiso('Segundo Piso')" class="piso-btn px-6 py-2 rounded-lg font-bold shadow transition bg-[#003366] text-white">Segundo Piso</button>
    <button id="tabTercerPiso" onclick="cambiarPiso('Tercer Piso')" class="piso-btn px-6 py-2 rounded-lg font-bold shadow transition bg-gray-200 text-gray-700 hover:bg-gray-300">Tercer Piso</button>
  </div>

  <!-- Contenido Principal -->
  <main class="max-w-7xl mx-auto w-full px-4 grid grid-cols-1 md:grid-cols-3 gap-6 mb-12 flex-grow">

    <!-- Formulario de Reserva -->
    <section class="bg-white p-6 rounded-xl shadow-md border border-gray-200 h-fit">
      <h2 class="text-xl font-bold mb-4 text-gray-800">Realizar Reserva</h2>
      
      <form id="formReserva" onsubmit="guardarReserva(event)" class="space-y-4">
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Nombre del Profesor:</label>
          <input type="text" id="profesor" required placeholder="Ingrese nombre y apellido" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Curso:</label>
          <select id="curso" required class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
            <option value="">Seleccione una opción...</option>
            <option value="Kínder A">Kínder A</option>
            <option value="1° Básico A">1° Básico A</option>
            <option value="2° Básico A">2° Básico A</option>
            <option value="3° Básico A">3° Básico A</option>
            <option value="4° Básico A">4° Básico A</option>
            <option value="5° Básico A">5° Básico A</option>
            <option value="6° Básico A">6° Básico A</option>
            <option value="7° Básico A">7° Básico A</option>
            <option value="8° Básico A">8° Básico A</option>
            <option value="1° Medio A">1° Medio A</option>
            <option value="2° Medio A">2° Medio A</option>
            <option value="3° Medio A">3° Medio A</option>
            <option value="4° Medio A">4° Medio A</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Asignatura:</label>
          <input type="text" id="asignatura" required placeholder="Ej: Lenguaje, Matemática..." class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1">Fecha:</label>
            <input type="date" id="fecha" required onchange="actualizarBloquesDisponibles()" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1">Bloque Horario:</label>
            <select id="bloque" required class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
              <option value="">Seleccione fecha...</option>
            </select>
          </div>
        </div>

        <button type="submit" class="w-full bg-[#003366] hover:bg-blue-900 text-white font-bold py-3 rounded-lg shadow transition mt-2">
          Reservar Laboratorio
        </button>
      </form>
    </section>

    <!-- Visualización de Disponibilidad Semanal -->
    <section class="bg-white p-6 rounded-xl shadow-md border border-gray-200 md:col-span-2 overflow-x-auto">
      <div class="flex justify-between items-center mb-4">
        <button onclick="cambiarSemana(-1)" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-medium px-3 py-1.5 rounded text-sm">⬅️ Semana Anterior</button>
        <h2 class="text-xl font-bold text-gray-800">Disponibilidad Semanal</h2>
        <button onclick="cambiarSemana(1)" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-medium px-3 py-1.5 rounded text-sm">Semana Siguiente ➡️</button>
      </div>

      <div id="loading" class="text-center py-8 text-gray-500 font-medium">Cargando disponibilidad...</div>
      <div id="errorMsg" class="hidden text-center py-8 text-red-600 font-medium">Error al conectar con la base de datos.</div>
      
      <table id="tablaHorarios" class="w-full text-sm text-left border-collapse border border-gray-300 hidden">
        <thead>
          <tr class="bg-gray-100 text-gray-700 border-b border-gray-300" id="encabezadoDias">
            <th class="p-2 border border-gray-300">Bloque</th>
            <!-- Días generados por JS -->
          </tr>
        </thead>
        <tbody id="cuerpoTabla" class="divide-y divide-gray-200">
          <!-- Filas de bloques generadas por JS -->
        </tbody>
      </table>
    </section>
  </main>

  <!-- Modal Admin -->
  <div id="modalAdmin" class="fixed inset-0 bg-black/50 backdrop-blur-sm flex justify-center items-center hidden z-50">
    <div class="bg-white p-6 rounded-xl shadow-2xl max-w-sm w-full mx-4">
      <h3 class="text-lg font-bold mb-4 text-gray-800">Autenticación Administrador</h3>
      <input type="password" id="claveAdminInput" placeholder="Ingrese la contraseña" class="w-full border border-gray-300 rounded-lg p-2.5 mb-4 focus:ring-2 focus:ring-blue-500 focus:outline-none">
      <div class="flex justify-end gap-2">
        <button onclick="toggleAdminModal()" class="px-4 py-2 bg-gray-200 hover:bg-gray-300 text-gray-700 rounded-lg text-sm font-semibold">Cancelar</button>
        <button onclick="loginAdmin()" class="px-4 py-2 bg-[#003366] hover:bg-blue-900 text-white rounded-lg text-sm font-semibold">Ingresar</button>
      </div>
    </div>
  </div>

  <script>
    // -------------------------------------------------------------
    // CONFIGURACIÓN DE SUPABASE (CORREGIDA)
    // -------------------------------------------------------------
    const SUPABASE_URL = 'https://eivekzpaavvkwgjegrfm.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVpdmVrenBhYXZ2a3dnamVncmZtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxNDE2NzUsImV4cCI6MjEwNTcxNzY3NX0.X8YwpsAxNASryBwp9q1zlC0vSlG9aiHIEb7iGwNtwLU';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const CLAVE_ADMIN = "admin123";
    let esAdmin = false;
    let pisoActual = 'Segundo Piso';
    let fechaReferenciaSemana = new Date();

    const BLOQUES = [
      "1° Bloque (08:00 - 09:30)",
      "2° Bloque (09:45 - 11:15)",
      "3° Bloque (11:30 - 13:00)",
      "4° Bloque (13:45 - 15:15)",
      "5° Bloque (15:30 - 17:00)"
    ];

    // Inicialización
    window.onload = () => {
      // Establecer fecha mínima como hoy en el selector
      const hoyStr = new Date().toISOString().split('T')[0];
      document.getElementById('fecha').min = hoyStr;
      
      cargarHorarios();
    };

    function cambiarPiso(piso) {
      pisoActual = piso;
      document.querySelectorAll('.piso-btn').forEach(btn => {
        btn.classList.remove('bg-[#003366]', 'text-white');
        btn.classList.add('bg-gray-200', 'text-gray-700');
      });

      if (piso === 'Primer Piso') document.getElementById('tabPrimerPiso').className = "piso-btn px-6 py-2 rounded-lg font-bold shadow transition bg-[#003366] text-white";
      if (piso === 'Segundo Piso') document.getElementById('tabSegundoPiso').className = "piso-btn px-6 py-2 rounded-lg font-bold shadow transition bg-[#003366] text-white";
      if (piso === 'Tercer Piso') document.getElementById('tabTercerPiso').className = "piso-btn px-6 py-2 rounded-lg font-bold shadow transition bg-[#003366] text-white";

      cargarHorarios();
    }

    function cambiarSemana(dias) {
      fechaReferenciaSemana.setDate(fechaReferenciaSemana.getDate() + (dias * 7));
      cargarHorarios();
    }

    function obtenerLunesYSabado(d) {
      const date = new Date(d);
      const day = date.getDay();
      const diffLunes = date.getDate() - day + (day === 0 ? -6 : 1);
      
      const lunes = new Date(date.setDate(diffLunes));
      const viernes = new Date(lunes);
      viernes.setDate(lunes.getDate() + 4);

      return { lunes, viernes };
    }

    async function cargarHorarios() {
      document.getElementById('loading').classList.remove('hidden');
      document.getElementById('tablaHorarios').classList.add('hidden');
      document.getElementById('errorMsg').classList.add('hidden');

      const { lunes, viernes } = obtenerLunesYSabado(fechaReferenciaSemana);
      const lunesStr = lunes.toISOString().split('T')[0];
      const viernesStr = viernes.toISOString().split('T')[0];

      try {
        // Consultar reservas de la semana en Supabase
        const { data: reservas, error: errRes } = await _supabase
          .from('reservas')
          .select('*')
          .eq('laboratorio', pisoActual)
          .gte('fecha', lunesStr)
          .lte('fecha', viernesStr);

        // Consultar bloqueos
        const { data: bloqueos, error: errBloq } = await _supabase
          .from('bloqueos')
          .select('*')
          .eq('laboratorio', pisoActual)
          .gte('fecha', lunesStr)
          .lte('fecha', viernesStr);

        if (errRes || errBloq) throw errRes || errBloq;

        renderizarTabla(lunes, reservas || [], bloqueos || []);
      } catch (e) {
        console.error("Error al obtener datos:", e);
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('errorMsg').classList.remove('hidden');
      }
    }

    function renderizarTabla(lunes, reservas, bloqueos) {
      const diasSemana = ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes'];
      const fechasDias = [];

      // Renderizar Encabezado
      const trEncabezado = document.getElementById('encabezadoDias');
      trEncabezado.innerHTML = '<th class="p-2 border border-gray-300">Bloque</th>';

      for (let i = 0; i < 5; i++) {
        const dia = new Date(lunes);
        dia.setDate(lunes.getDate() + i);
        const fechaStr = dia.toISOString().split('T')[0];
        fechasDias.push(fechaStr);

        const diaNum = dia.getDate();
        const mesNum = dia.getMonth() + 1;

        trEncabezado.innerHTML += `
          <th class="p-2 border border-gray-300 text-center">
            ${diasSemana[i]}<br>
            <span class="text-xs text-gray-500 font-normal">${diaNum}/${mesNum}</span>
          </th>
        `;
      }

      // Renderizar Filas por Bloque
      const cuerpo = document.getElementById('cuerpoTabla');
      cuerpo.innerHTML = '';

      BLOQUES.forEach(bloque => {
        let tr = `<tr><td class="p-2 border border-gray-300 font-medium text-xs bg-gray-50">${bloque}</td>`;

        fechasDias.forEach(fecha => {
          const res = reservas.find(r => r.fecha === fecha && r.bloque === bloque);
          const bloq = bloqueos.find(b => b.fecha === fecha && b.bloque === bloque);

          if (bloq) {
            tr += `
              <td class="p-2 border border-gray-300 bg-gray-200 text-center align-middle">
                <span class="text-xs font-bold text-gray-600 block">🔒 Bloqueado</span>
                ${esAdmin ? `<button onclick="eliminarBloqueo(${bloq.id})" class="mt-1 text-red-600 hover:text-red-800 text-xs underline">Desbloquear</button>` : ''}
              </td>
            `;
          } else if (res) {
            tr += `
              <td class="p-2 border border-gray-300 bg-red-50 text-center align-middle">
                <div class="text-xs">
                  <span class="font-bold text-red-800 block">${res.profesor}</span>
                  <span class="text-gray-600 block">${res.curso}</span>
                  <span class="text-gray-500 italic block">${res.asignatura}</span>
                  ${esAdmin ? `<button onclick="eliminarReserva(${res.id})" class="mt-1 text-red-600 hover:text-red-800 text-xs underline">Eliminar</button>` : ''}
                </div>
              </td>
            `;
          } else {
            tr += `
              <td class="p-2 border border-gray-300 bg-emerald-50 text-center align-middle">
                <span class="text-xs text-emerald-700 font-semibold block">Disponible</span>
                ${esAdmin ? `<button onclick="bloquearBloque('${fecha}', '${bloque}')" class="mt-1 text-gray-600 hover:text-black text-xs underline">Bloquear</button>` : ''}
              </td>
            `;
          }
        });

        tr += `</tr>`;
        cuerpo.innerHTML += tr;
      });

      document.getElementById('loading').classList.add('hidden');
      document.getElementById('tablaHorarios').classList.remove('hidden');
    }

    async function actualizarBloquesDisponibles() {
      const fechaVal = document.getElementById('fecha').value;
      const selectBloque = document.getElementById('bloque');
      selectBloque.innerHTML = '<option value="">Cargando bloques...</option>';

      if (!fechaVal) return;

      try {
        const { data: reservas } = await _supabase
          .from('reservas')
          .select('bloque')
          .eq('laboratorio', pisoActual)
          .eq('fecha', fechaVal);

        const { data: bloqueos } = await _supabase
          .from('bloqueos')
          .select('bloque')
          .eq('laboratorio', pisoActual)
          .eq('fecha', fechaVal);

        const ocupados = [
          ...(reservas || []).map(r => r.bloque),
          ...(bloqueos || []).map(b => b.bloque)
        ];

        selectBloque.innerHTML = '<option value="">Seleccione un bloque...</option>';
        
        BLOQUES.forEach(bloque => {
          const estaOcupado = ocupados.includes(bloque);
          selectBloque.innerHTML += `
            <option value="${bloque}" ${estaOcupado ? 'disabled class="bg-gray-100 text-gray-400"' : ''}>
              ${bloque} ${estaOcupado ? '(Ocupado)' : ''}
            </option>
          `;
        });
      } catch (e) {
        console.error(e);
      }
    }

    async function guardarReserva(e) {
      e.preventDefault();

      const nuevaReserva = {
        laboratorio: pisoActual,
        fecha: document.getElementById('fecha').value,
        bloque: document.getElementById('bloque').value,
        profesor: document.getElementById('profesor').value,
        curso: document.getElementById('curso').value,
        asignatura: document.getElementById('asignatura').value
      };

      try {
        const { error } = await _supabase.from('reservas').insert([nuevaReserva]);
        if (error) throw error;

        alert('¡Reserva realizada exitosamente!');
        document.getElementById('formReserva').reset();
        cargarHorarios();
      } catch (err) {
        alert('Error al realizar la reserva: ' + err.message);
      }
    }

    async function eliminarReserva(id) {
      if (!confirm('¿Está seguro de eliminar esta reserva?')) return;
      try {
        const { error } = await _supabase.from('reservas').delete().eq('id', id);
        if (error) throw error;
        cargarHorarios();
      } catch (err) {
        alert('Error al eliminar: ' + err.message);
      }
    }

    async function bloquearBloque(fecha, bloque) {
      try {
        const { error } = await _supabase.from('bloqueos').insert([{
          laboratorio: pisoActual,
          fecha,
          bloque
        }]);
        if (error) throw error;
        cargarHorarios();
      } catch (err) {
        alert('Error al bloquear: ' + err.message);
      }
    }

    async function eliminarBloqueo(id) {
      try {
        const { error } = await _supabase.from('bloqueos').delete().eq('id', id);
        if (error) throw error;
        cargarHorarios();
      } catch (err) {
        alert('Error al desbloquear: ' + err.message);
      }
    }

    // Lógica Modal Admin
    function toggleAdminModal() {
      if (esAdmin) {
        esAdmin = false;
        document.getElementById('lblBtnAdmin').innerText = "Modo Admin";
        cargarHorarios();
      } else {
        document.getElementById('modalAdmin').classList.toggle('hidden');
      }
    }

    function loginAdmin() {
      const pass = document.getElementById('claveAdminInput').value;
      if (pass === CLAVE_ADMIN) {
        esAdmin = true;
        document.getElementById('lblBtnAdmin').innerText = "Salir de Modo Admin";
        document.getElementById('claveAdminInput').value = "";
        toggleAdminModal();
        cargarHorarios();
      } else {
        alert('Contraseña incorrecta');
      }
    }
  </script>
</body>
</html>
